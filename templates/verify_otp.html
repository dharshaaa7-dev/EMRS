<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | EMRS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/verify_otp.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        .error-message{
            margin-top:20px;
            padding:12px;
            background:#ffe6e6;
            color:hsl(244, 100%, 13%);
            border:1px solid #ff9999;
            border-radius:8px;
            font-size:15px;
            font-weight:600;
            text-align:center;
            animation:shake .4s;
        }

        @keyframes shake{
            0%{transform:translateX(0);}
            20%{transform:translateX(-8px);}
            40%{transform:translateX(8px);}
            60%{transform:translateX(-6px);}
            80%{transform:translateX(6px);}
            100%{transform:translateX(0);}
        }

    </style>

</head>

<body>

<div class="container">

    <div class="otp-box">

        <div class="icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>Verify OTP</h1>

        <p>
            Enter the 6-digit OTP sent to your registered Gmail.
        </p>

        <form method="POST">

            <div class="input-box">

                <i class="fa-solid fa-key"></i>

                <input
                    type="text"
                    name="otp"
                    maxlength="6"
                    placeholder="Enter OTP"
                    required>

            </div>

            {% if error %}
            <div class="error-message">
                <i class="fa-solid fa-circle-xmark"></i>
                {{ error }}
            </div>
            {% endif %}

            <button type="submit">
                <i class="fa-solid fa-circle-check"></i>
                Verify OTP
            </button>

        </form>

        <div style="margin-top:20px;">
            <a href="{{ url_for('forgot_password', role=role) }}">
                ← Back to Forgot Password
            </a>
        </div>

    </div>

</div>

</body>

</html>
