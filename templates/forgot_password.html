<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EMRS - Forgot Password</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="forgot-box">

        <div class="logo">
            <i class="fa-solid fa-hospital"></i>
        </div>

        <h1>EMRS</h1>

        <h2>{{ role.title() }} Password Recovery</h2>

        <p>
            Enter your registered Email or Mobile Number to reset your
            {{ role.title() }} password.
        </p>
                <form method="POST">

            <input
                type="hidden"
                name="role"
                value="{{ role }}">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="login_id"
                    placeholder="Enter Email or Mobile Number"
                    required>

            </div>

            <button type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Send OTP
            </button>

        </form>

        <a href="{{ url_for(role + '_login') }}" class="back">
            ← Back to {{ role.title() }} Login
        </a>

    </div>

</div>

</body>
</html>
