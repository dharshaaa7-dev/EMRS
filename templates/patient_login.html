<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login | EMRS</title>

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/patient_login.css') }}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Floating Circles -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="login-box">

        <div class="patient-icon">
            <i class="fa-solid fa-user-injured"></i>
        </div>

        <h1>Patient Login</h1>

        <p class="subtitle">
            Welcome Back! Login to securely access your Electronic Medical Records.
        </p>
        {% if error %}
        <div style="color:red; text-align:center; margin-bottom:15px; font-weight:bold;">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('patient_login') }}" method="POST">

            <!-- Email / Username -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="login_id"
                    placeholder="Email or Username"
                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required>

                <span
                    class="toggle-password"
                    onclick="togglePassword()">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <!-- Forgot Password -->
             <div class="forgot">
                <a href="{{ url_for('forgot_password', role='patient') }}">
                Forgot Password?
            </a>
            
             </div>

            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <!-- Register -->

        <div class="register">

            <p>New Patient?</p>

            <a href="{{ url_for('patient_register') }}">
                Create New Account
            </a>

        </div>

        <!-- Back -->

        <a
            href="{{ url_for('login') }}"
            class="back">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>

    </div>

</div>

<script>

function togglePassword(){

    const password=document.getElementById("password");

    if(password.type==="password"){

        password.type="text";

    }

    else{

        password.type="password";

    }

}

</script>

</body>
</html>
