<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMRS - Edit Doctor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_doctor_edit.css') }}">
</head>
<body>

  <div class="main-content">

    <div class="top-bar">
      <a href="{{ url_for('admin_doctor') }}" class="btn-back">⬅ Back to Doctor Lookup</a>
    </div>

    <div class="card">
      <h1>Edit Doctor Details</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p class="not-found" style="color:#5fd68a;">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_doctor_edit', doctor_id=doctor.doctor_id) }}" class="edit-form">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" value="{{ doctor.full_name }}" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ doctor.email }}" required>
        </div>

        <div class="form-group">
          <label>Mobile</label>
          <input type="text" name="mobile" value="{{ doctor.mobile }}" required>
        </div>

        <div class="form-group">
          <label>Specialization</label>
          <input type="text" name="specialization" value="{{ doctor.specialization }}" required>
        </div>

        <div class="form-group">
          <label>Qualification</label>
          <input type="text" name="qualification" value="{{ doctor.qualification }}" required>
        </div>

        <div class="form-group">
          <label>License No</label>
          <input type="text" name="license_no" value="{{ doctor.license_no }}" required>
        </div>

        <div class="form-group">
          <label>Hospital Name</label>
          <input type="text" name="hospital_name" value="{{ doctor.hospital_name }}" required>
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" name="hospital_city" value="{{ doctor.hospital_city }}" required>
        </div>

        <div class="form-group">
          <label>District</label>
          <input type="text" name="hospital_district" value="{{ doctor.hospital_district }}" required>
        </div>

        <div class="form-group">
          <label>State</label>
          <input type="text" name="hospital_state" value="{{ doctor.hospital_state }}" required>
        </div>

        <button type="submit" class="btn-primary">💾 Save Changes</button>

      </form>
    </div>

  </div>

</body>
</html>
