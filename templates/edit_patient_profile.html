<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | EMRS</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/edit_patient_profile.css') }}">
</head>

<body>

<div class="container">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-hospital"></i>
            <h2>EMRS</h2>
        </div>

        <ul>

            <li>
                <a href="{{ url_for('patient_dashboard') }}">
                    <i class="fa-solid fa-user"></i>
                    My Profile
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-calendar-check"></i>
                    Appointments
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-file-medical"></i>
                    Medical Records
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-prescription-bottle-medical"></i>
                    Prescriptions
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-flask"></i>
                    Lab Reports
                </a>
            </li>

            <li class="active">
                <a href="{{ url_for('edit_patient_profile') }}">
                    <i class="fa-solid fa-user-pen"></i>
                    Edit Profile
                </a>
            </li>

            <li>
                <a href="{{ url_for('logout') }}">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </div>

    <!-- ================= MAIN CONTENT ================= -->

    <div class="main-content">

        <div class="header">

            <div>
                <h1>Edit Profile</h1>
                <p class="sub-title">
                    Update your personal and medical information
                </p>
            </div>

        </div>

        <!-- ================= FORM CARD ================= -->

        <div class="form-card">

            <form action="{{ url_for('edit_patient_profile') }}"
                  method="POST"
                  autocomplete="on">

                <h3 class="section-title">
                    Basic Details
                </h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>

                        <input
                            type="text"
                            name="full_name"
                            value="{{ patient.full_name }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            value="{{ patient.email }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            name="mobile"
                            value="{{ patient.mobile }}"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>

                        <input
                            type="date"
                            name="dob"
                            value="{{ patient.dob }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <select name="gender" required>

                            <option value="Male"
                                {% if patient.gender=="Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if patient.gender=="Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if patient.gender=="Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Blood Group</label>

                        <select name="blood_group" required>

                            {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}

                            <option value="{{ bg }}"
                                {% if patient.blood_group==bg %}selected{% endif %}>
                                {{ bg }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <h3 class="section-title">
                    Address Details
                </h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>House No.</label>

                        <input
                            type="text"
                            name="house_no"
                            value="{{ patient.house_no }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Street</label>

                        <input
                            type="text"
                            name="street"
                            value="{{ patient.street }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>City</label>

                        <input
                            type="text"
                            name="city"
                            value="{{ patient.city }}"
                            required>
                    </div>

                    <div class="form-group">
                        <label>District</label>

                        <input
                            type="text"
                            name="district"
                            value="{{ patient.district }}"
                            required>
                    </div>

                                    <div class="form-group">
                        <label>House No.</label>
                        <input type="text" name="house_no" value="{{ patient.house_no }}" required>
                    </div>

                    <div class="form-group">
                        <label>Street</label>
                        <input type="text" name="street" value="{{ patient.street }}" required>
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" value="{{ patient.city }}" required>
                    </div>

                    <div class="form-group">
                        <label>District</label>
                        <input type="text" name="district" value="{{ patient.district }}" required>
                    </div>

                    <div class="form-group">
                        <label>State</label>
                        <input type="text" name="state" value="{{ patient.state }}" required>
                    </div>

                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" name="pincode" value="{{ patient.pincode }}" required>
                    </div>

                </div>

                <!-- ================= EMERGENCY CONTACT ================= -->

                <h3 class="section-title">Emergency Contact</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Contact Name</label>
                        <input type="text" name="emergency_name"
                            value="{{ patient.emergency_name }}" required>
                    </div>

                    <div class="form-group">
                        <label>Contact Phone</label>
                        <input type="text" name="emergency_phone"
                            value="{{ patient.emergency_phone }}" required>
                    </div>

                </div>

                <!-- ================= BUTTONS ================= -->

                <div class="form-actions">

                    <a href="{{ url_for('patient_dashboard') }}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<footer class="footer">
    © 2026 EMRS | Electronic Medical Record System
</footer>

</body>
</html>
