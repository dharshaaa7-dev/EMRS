<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Changed | EMRS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,92,160,.78),rgba(0,92,160,.78)),
    url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    overflow:hidden;

}

.card{

    width:450px;
    padding:45px 35px;

    text-align:center;

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(16px);

    border-radius:22px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 20px 45px rgba(0,0,0,.35);

    animation:popup .8s ease;

}

.logo{

    width:95px;
    height:95px;

    margin:auto;

    border-radius:50%;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#0d6efd;

    font-size:42px;

    animation:heartbeat 1.5s infinite;

}

.tick{

    margin-top:18px;

    font-size:78px;

    color:hsl(246, 100%, 14%);

    text-shadow:0 0 12px rgba(8,120,48,.3);

    animation:zoom .8s;

}

h1{

    margin-top:18px;

    color:white;

    font-size:34px;

    letter-spacing:1px;

}

h2{

    margin-top:12px;

    color:hsl(246, 100%, 14%);

    font-size:30px;

    font-weight:bold;

}

p{

    margin-top:18px;

    color:white;

    line-height:30px;

    font-size:17px;

}

.btn{

    display:inline-flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    margin-top:35px;

    padding:14px 35px;

    background:#1565C0;

    color:white;

    text-decoration:none;

    border-radius:35px;

    font-size:17px;

    font-weight:600;

    min-width:210px;

    transition:.3s;

}

.btn:hover{

    background:#0D47A1;

    transform:translateY(-4px);

    box-shadow:0 12px 22px rgba(0,0,0,.35);

}

.btn i{

    font-size:18px;

}

@keyframes heartbeat{

0%{transform:scale(1);}
25%{transform:scale(1.10);}
50%{transform:scale(1);}
75%{transform:scale(1.10);}
100%{transform:scale(1);}

}

@keyframes popup{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes zoom{

0%{

transform:scale(0);

}

70%{

transform:scale(1.15);

}

100%{

transform:scale(1);

}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
<i class="fa-solid fa-hospital"></i>
</div>

<div class="tick">
<i class="fa-solid fa-circle-check"></i>
</div>

<h1>EMRS</h1>

<h2>Password Changed!</h2>

<p>
Your password has been updated successfully.
<br>
You can now login using your new password.
</p>

<a href="{{ url_for(role + '_login') }}" class="btn">
<i class="fa-solid fa-right-to-bracket"></i>
Go to Login
</a>

</div>

</body>

</html>
