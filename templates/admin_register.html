<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | EMRS</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/admin_register.css') }}">
</head>

<body>

<div class="container">

    <div class="register-box">

        <div class="admin-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Admin Registration</h1>

        <p class="subtitle">
            Create your administrator account to manage the Hospital Management System.
        </p>

        <form action="{{ url_for('admin_register') }}" method="POST">

            <!-- Full Name -->
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text"
                       name="full_name"
                       placeholder="Full Name"
                       required>
            </div>

            <!-- Username -->
            <div class="input-box">
                <i class="fa-solid fa-circle-user"></i>
                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>
            </div>

            <!-- Employee ID -->
            <div class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input type="text"
                       name="employee_id"
                       placeholder="Employee ID"
                       required>
            </div>

            <!-- Email -->
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>
            </div>

            <!-- Mobile -->
            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="tel"
                       name="mobile"
                       placeholder="Mobile Number"
                       required>
            </div>

            <!-- Gender -->
            <div class="input-box">
                <i class="fa-solid fa-venus-mars"></i>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Hospital Name -->
            <div class="input-box">
                <i class="fa-solid fa-hospital"></i>
                <input type="text"
                       name="hospital_name"
                       placeholder="Hospital Name"
                       required>
            </div>
                        <!-- Department -->
            <div class="input-box">
                <i class="fa-solid fa-building"></i>
                <select name="department" required>
                    <option value="">Select Department</option>
                    <option>Administration</option>
                    <option>Human Resources</option>
                    <option>Finance</option>
                    <option>Operations</option>
                    <option>IT Department</option>
                    <option>Medical Records</option>
                </select>
            </div>

            <!-- Address -->
            <div class="input-box">
                <i class="fa-solid fa-location-dot"></i>
                <textarea name="address"
                          placeholder="Address"
                          rows="3"
                          required></textarea>
            </div>

            <!-- City -->
            <div class="input-box">
                <i class="fa-solid fa-city"></i>
                <input type="text"
                       name="city"
                       placeholder="City"
                       required>
            </div>

            <!-- State -->
            <div class="input-box">
                <i class="fa-solid fa-earth-asia"></i>
                <input type="text"
                       name="state"
                       placeholder="State"
                       required>
            </div>

            <!-- Pincode -->
            <div class="input-box">
                <i class="fa-solid fa-location-pin"></i>
                <input type="text"
                       name="pincode"
                       placeholder="Pincode"
                       required>
            </div>

            <!-- Password -->
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       required>

                <span class="toggle-password" onclick="togglePassword('password', this)">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <!-- Confirm Password -->
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm Password"
                       required>

                <span class="toggle-password" onclick="togglePassword('confirm_password', this)">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <!-- Register Button -->
            <button type="submit" class="register-btn">
                <i class="fa-solid fa-user-plus"></i>
                Create Admin Account
            </button>

        </form>

        <!-- Back -->
        <a href="{{ url_for('login') }}" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>

    </div>

    <!-- Floating Circles -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

</div>

<script>
function togglePassword(id, element){
    const input = document.getElementById(id);
    const icon = element.querySelector("i");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }else{
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
